<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="brand_colors.css">
<style>
  html, body {
    margin:0; padding:0;
    width:1080px; height:1920px; overflow:hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .stage {
    position:relative; width:1080px; height:1920px;
    background: linear-gradient(160deg, #1B2430 0%, #121212 55%, #1B2430 100%);
  }

  /* Soft glowing orange accent shapes, subtle, not distracting behind a speaker */
  .glow1 {
    position:absolute; top:-200px; right:-200px; width:700px; height:700px;
    border-radius:50%; background: radial-gradient(circle, rgba(255,107,0,0.18), transparent 70%);
  }
  .glow2 {
    position:absolute; bottom:-250px; left:-250px; width:800px; height:800px;
    border-radius:50%; background: radial-gradient(circle, rgba(0,168,150,0.12), transparent 70%);
  }

  .brandMark {
    position:absolute; bottom:80px; left:50%; transform:translateX(-50%);
    text-align:center;
  }
  .brandName { font-size:32px; font-weight:800; color:rgba(255,255,255,0.85); letter-spacing:2px; }
  .brandTag { font-size:20px; color:rgba(255,107,0,0.9); font-weight:600; margin-top:6px; letter-spacing:1px; }

  .gridLines {
    position:absolute; top:0; left:0; width:100%; height:100%;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 60px 60px;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="gridLines"></div>
    <div class="glow1"></div>
    <div class="glow2"></div>
    <div class="brandMark">
      <div class="brandName">MJ BUSINESS SOLUTIONS</div>
      <div class="brandTag">FINANCE · TAX · COMPLIANCE</div>
    </div>
  </div>
</body>
</html>
