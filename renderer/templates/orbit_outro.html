<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="brand_colors.css">
<style>
  html, body {
    margin:0; padding:0; background: transparent;
    width:1080px; height:1920px; overflow:hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
    user-select: none;
  }
  .stage { position:relative; width:1080px; height:1920px; }

  .centerLogo {
    position:absolute; top:760px; left:540px; transform:translate(-50%,-50%) scale(0);
    width:220px; height:220px; border-radius:50%;
    background: linear-gradient(135deg, #1B2430, #121212);
    box-shadow: 0 16px 50px rgba(0,0,0,0.5);
    display:flex; align-items:center; justify-content:center;
    transition: transform 0.7s cubic-bezier(.34,1.56,.64,1);
  }
  .centerLogo.show { transform:translate(-50%,-50%) scale(1); }
  .centerLogoText { font-size:26px; font-weight:800; color:#FF6B00; text-align:center; line-height:1.3; }

  .orbitRing {
    position:absolute; top:760px; left:540px; width:520px; height:520px;
    transform:translate(-50%,-50%) rotate(0deg) scale(0.7); opacity:0;
    transition: opacity 0.6s ease, transform 1.8s cubic-bezier(.22,.68,0,1.01);
  }
  .orbitRing.show { opacity:1; transform:translate(-50%,-50%) rotate(360deg) scale(1); }

  .orbitIcon {
    position:absolute; width:80px; height:80px; border-radius:50%;
    background: var(--brand-orange, #FF6B00);
    display:flex; align-items:center; justify-content:center;
    font-size:32px; box-shadow: 0 6px 20px rgba(255,107,0,0.4);
  }

  .tagline {
    position:absolute; top:1120px; left:50%; transform:translateX(-50%) translateY(15px);
    font-size:30px; font-weight:700; color:#FFFFFF; text-align:center;
    background: rgba(18,18,18,0.82); padding:16px 30px; border-radius:14px;
    opacity:0; transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .tagline.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="stage">
    <div class="orbitRing" id="orbitRing">
      <div class="orbitIcon" style="top:0px; left:220px;">📊</div>
      <div class="orbitIcon" style="top:220px; left:440px;">🧾</div>
      <div class="orbitIcon" style="top:440px; left:220px;">📈</div>
      <div class="orbitIcon" style="top:220px; left:0px;">🏢</div>
    </div>

    <div class="centerLogo" id="centerLogo">
      <div class="centerLogoText">MJ BUSINESS<br>SOLUTIONS</div>
    </div>

    <div class="tagline" id="tagline">Follow for Business & Tax Tips</div>
  </div>

<script>
  const orbitRing = document.getElementById('orbitRing');
  const centerLogo = document.getElementById('centerLogo');
  const tagline = document.getElementById('tagline');

  setTimeout(() => { orbitRing.classList.add('show'); }, 200);
  setTimeout(() => { centerLogo.classList.add('show'); }, 500);
  setTimeout(() => { tagline.classList.add('show'); }, 1900);
</script>
</body>
</html>
