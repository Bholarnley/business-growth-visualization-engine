<!DOCTYPE html>
<html>
<head>
<style>
  html, body {
    margin:0; padding:0; background: transparent;
    width:1080px; height:1920px; overflow:hidden;
  }
  .stage { position:relative; width:1080px; height:1920px; }

  .piece {
    position:absolute; top:400px; left:540px; width:16px; height:16px;
    opacity:0;
    transition: top 1.2s cubic-bezier(.22,.68,0,1.01), left 1.2s cubic-bezier(.22,.68,0,1.01), opacity 0.3s ease, transform 1.2s ease;
  }
</style>
</head>
<body>
  <div class="stage" id="stage"></div>

<script>
  const stage = document.getElementById('stage');
  const colors = ['#FF6B00', '#FFB800', '#2ECC71', '#00A896', '#E63946', '#FFFFFF'];
  const pieces = [];

  // Generate 40 confetti pieces at random angles/distances from center
  for (let i = 0; i < 40; i++) {
    const el = document.createElement('div');
    el.className = 'piece';
    el.style.background = colors[i % colors.length];
    el.style.borderRadius = (i % 3 === 0) ? '50%' : '2px';
    stage.appendChild(el);
    pieces.push(el);
  }

  setTimeout(() => {
    pieces.forEach((el, i) => {
      const angle = (Math.PI * 2 * i) / pieces.length + (Math.random() * 0.5);
      const distance = 250 + Math.random() * 350;
      const targetLeft = 540 + Math.cos(angle) * distance;
      const targetTop = 400 + Math.sin(angle) * distance;
      const rotate = Math.random() * 720;

      el.style.opacity = '1';
      el.style.left = targetLeft + 'px';
      el.style.top = targetTop + 'px';
      el.style.transform = `rotate(${rotate}deg)`;
    });
  }, 150);

  setTimeout(() => {
    pieces.forEach((el) => { el.style.opacity = '0'; });
  }, 1400);
</script>
</body>
</html>
